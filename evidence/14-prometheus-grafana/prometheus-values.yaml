alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

server:
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: checkout-fn
        metrics_path: /prometheus
        static_configs:
          - targets:
              - checkout-svc.lab4.svc.cluster.local:3003
