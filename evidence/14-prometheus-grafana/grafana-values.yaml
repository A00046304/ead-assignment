adminUser: admin
adminPassword: admin

persistence:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: CA2-Prometheus
        type: prometheus
        access: proxy
        url: http://ca2-prometheus-server.monitoring.svc.cluster.local
        isDefault: true
