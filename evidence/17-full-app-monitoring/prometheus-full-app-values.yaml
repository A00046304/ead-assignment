alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: true

server:
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 700m
      memory: 768Mi

serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: checkout-fn
        metrics_path: /prometheus
        static_configs:
          - targets:
              - checkout-svc.lab4.svc.cluster.local:3003

      - job_name: pricing-fn
        metrics_path: /prometheus
        static_configs:
          - targets:
              - pricing-svc.lab4.svc.cluster.local:3001

      - job_name: inventory-fn
        metrics_path: /prometheus
        static_configs:
          - targets:
              - inventory-svc.lab4.svc.cluster.local:3002

      - job_name: gateway
        metrics_path: /prometheus
        static_configs:
          - targets:
              - gateway-svc.lab4.svc.cluster.local:80

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - ca2-prometheus-kube-state-metrics.monitoring.svc.cluster.local:8080

      - job_name: node-exporter
        static_configs:
          - targets:
              - ca2-prometheus-prometheus-node-exporter.monitoring.svc.cluster.local:9100
