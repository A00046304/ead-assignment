server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html;
  }

  location = /api/arch {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"arch":"nanoservices-kubernetes","component":"nginx-configmap"}';
  }

  location = /api/ping {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"ok":true}';
  }

  location = /api/checkout {
  proxy_http_version 1.1;
  proxy_set_header Host localhost;
  proxy_set_header Connection "";
  proxy_set_header X-Request-Id $http_x_request_id;
  proxy_pass http://keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local:8080/api/checkout;
  }
}
