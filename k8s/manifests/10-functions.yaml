apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-fn
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-fn
  template:
    metadata:
      labels:
        app: checkout-fn
    spec:
      serviceAccountName: checkout-sa
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: checkout-fn
          image: lab4/checkout-fn:v5
          imagePullPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 64Mi
          ports:
            - containerPort: 3003
          env:
            - name: PRICING_URL
              value: http://pricing-svc:3001
            - name: INVENTORY_URL
              value: http://inventory-svc:3002
            - name: TIMEOUT_MS
              value: "1500"
            - name: DB_HOST
              value: postgres-svc
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-svc
spec:
  selector:
    app: checkout-fn
  ports:
    - port: 3003
      targetPort: 3003
