apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-fn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pricing-fn
  template:
    metadata:
      labels:
        app: pricing-fn
    spec:
      serviceAccountName: pricing-sa
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pricing-fn
          image: lab4/pricing-fn:v2
          imagePullPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 64Mi
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-svc
spec:
  selector:
    app: pricing-fn
  ports:
    - port: 3001
      targetPort: 3001
---
